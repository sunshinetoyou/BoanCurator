name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: boan
          POSTGRES_PASSWORD: boan
          POSTGRES_DB: boan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boan -d boan_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: BE/requirements.txt

      - name: Install dependencies
        working-directory: BE
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: BE
        run: pytest -q

      - name: Run integration tests
        working-directory: BE
        env:
          DATABASE_URL: postgresql+psycopg2://boan:boan@localhost:5432/boan_test
        run: pytest -m integration -q

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [tests, sonarcloud]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./BE
          push: true
          build-args: |
            BUILD_TAG=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: |
            soo1278/boancurator-api:latest
            soo1278/boancurator-api:${{ github.sha }}
